<title>FT Poach Draft</title><style>
:root{--bg:#fbfaf7;--fg:#1d2433;--muted:#6b7280;--line:#e5e2da;--head:#1f3864;--headfg:#fff;--good:#1a7f4b;--bad:#b42318;--row:#f3f1eb}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--fg:#e8e6e1;--muted:#9aa0a8;--line:#2b3038;--head:#2c4a7c;--headfg:#fff;--good:#5cc98f;--bad:#f28b82;--row:#1b1f26}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1400px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.explain{border-left:3px solid var(--head);padding:4px 12px;margin:0 0 16px;font-size:.92rem}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:.92rem}
input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg);min-width:200px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--head);color:var(--headfg);font-weight:600;font-size:.8rem;padding:8px 8px;text-align:right;cursor:pointer;user-select:none;white-space:nowrap}
th.l,td.l{text-align:left}
th[aria-sort=ascending]::after{content:" ▲"}
th[aria-sort=descending]::after{content:" ▼"}
td{padding:6px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr:nth-child(even){background:var(--row)}
.pos{color:var(--good);font-weight:600}.neg{color:var(--bad);font-weight:600}
.small td{opacity:.6}
footer{color:var(--muted);font-size:.82rem;margin-top:16px}
nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:0 0 18px;border-bottom:1px solid var(--line)}
nav .lvl{font-size:.75rem;font-weight:700;letter-spacing:.06em;color:var(--muted);padding:8px 2px 8px 10px}
nav .lvl:first-child{padding-left:0}
nav a.jump{margin-left:auto;font-weight:600;color:var(--fg)}
nav a{padding:8px 12px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:.92rem}
nav a:hover{color:var(--fg)} nav a.on{color:var(--fg);border-bottom-color:var(--head);font-weight:600}
th.grp{border-left:2px solid rgba(255,255,255,.35)} td.grp{border-left:2px solid var(--line)}
.dense th,.dense td{padding-left:6px;padding-right:6px;font-size:.84rem}
th{white-space:normal;min-width:56px}
a.def{display:inline-block;margin-left:3px;width:14px;height:14px;line-height:14px;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;font-size:10px;text-align:center;text-decoration:none;vertical-align:1px}
a.def:hover{background:rgba(255,255,255,.5)}
.explain a{color:inherit}
.credit{margin-top:10px;font-style:italic}
.credit a{color:inherit}
.custom{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px;font-size:.92rem;padding:8px 10px;border:1px dashed var(--line);border-radius:8px}
.custom input{width:56px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg)}

.board{border-collapse:separate;border-spacing:0;width:100%;font-size:.84rem}
.board th{position:sticky;top:0;z-index:2;text-align:center;cursor:default;min-width:150px;padding:8px 6px}
.board th.lbl,.board td.lbl{position:sticky;left:0;z-index:1;min-width:74px;width:74px;background:var(--bg);color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:left;vertical-align:top}
.board thead th.lbl{z-index:3;background:var(--head);color:var(--headfg)}
.board td{text-align:left;white-space:normal;vertical-align:top;padding:5px 7px;border-top:1px solid var(--line);border-left:1px solid var(--line);line-height:1.25}
.board tbody tr:nth-child(even){background:none}
.board td.p{background:rgba(91,155,213,.14)} .board td.h{background:rgba(112,173,71,.14)} .board td.rp{background:rgba(128,100,162,.20);font-style:italic}
.board td.gap{border-top:2px solid var(--head)}
.board td.s6{background:rgba(237,125,49,.16)}
.board td.tw{background:rgba(255,192,0,.22)}

.board th.mine{background:#c00000}
.board .nm{display:block} .board .top{font-weight:700} .board .meta{display:block;color:var(--muted);font-size:.76rem;font-variant-numeric:tabular-nums}
.board .w{color:var(--fg);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;margin:0 0 10px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.wrap{overflow:auto;max-height:calc(100vh - 24px)}
h2{font-size:1.15rem;margin:28px 0 8px}
#list td.l,#list th.l{text-align:left}
</style></head>
